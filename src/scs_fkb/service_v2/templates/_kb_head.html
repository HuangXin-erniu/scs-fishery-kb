<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title or "渔业知识站" }} · 南海近岸渔业知识库</title>
<style>
:root{--ink:#132a2f;--muted:#587075;--line:#d7e3e2;--sea:#0f6b73;--sand:#f4f7f4;--warn:#8a4b00;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;color:var(--ink);background:var(--sand);line-height:1.65}
a{color:var(--sea)}
header.top{background:#fff;border-bottom:1px solid var(--line)}
header.top .wrap{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header.top strong{font-size:1.02rem}
header.top nav{display:flex;gap:12px;flex-wrap:wrap;font-size:.9rem}
main{max-width:960px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:1.35rem;margin:.2em 0 .3em}
h2{font-size:1.1rem;margin:28px 0 10px;padding-top:6px;border-top:1px solid var(--line)}
h3{font-size:1rem;margin:0 0 6px}
p.lead{color:var(--muted);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 6px 18px rgba(19,42,47,.05)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:700;background:#e8f0ef;color:var(--sea);margin:0 6px 6px 0}
.badge.warn{background:#f7e8d8;color:var(--warn)}
small.muted{color:var(--muted)}
form.filter{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
form.filter input,form.filter select{font:inherit;padding:9px 11px;border:1px solid #b9cbc9;border-radius:9px;background:#fff}
form.filter input{flex:1;min-width:180px}
button{font:inherit;font-weight:700;background:var(--sea);color:#fff;border:0;border-radius:9px;padding:9px 15px;cursor:pointer}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.tabs a{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:.85rem;text-decoration:none}
.tabs a.on{background:var(--sea);color:#fff;border-color:var(--sea)}
details{border-top:1px solid var(--line);padding:10px 0}
details summary{cursor:pointer;font-weight:650}
details .answer{margin:8px 0 4px}
.src{font-size:.82rem;color:var(--muted)}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:9px 10px;border-top:1px solid var(--line);vertical-align:top;font-size:.92rem}
th{background:#eef4f3;font-size:.84rem;color:var(--muted)}
ul.plain{padding-left:18px;margin:6px 0}
ol.steps{padding-left:22px}
footer{max-width:960px;margin:0 auto;padding:18px 16px 40px;color:var(--muted);font-size:.85rem}
@media(max-width:540px){th,td{font-size:.86rem;padding:7px 8px}main{padding:14px 12px 44px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">

</div></header>
