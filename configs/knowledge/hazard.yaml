- id: KNO-HAZARD-001
  title: 气象灾害预警信号分级与种类
  summary: 2007 年《气象灾害预警信号发布与传播办法》规定的分级、种类与发布主体。
  facts:
  - label: 分级
    value: Ⅳ级（一般）、Ⅲ级（较重）、Ⅱ级（严重）、Ⅰ级（特别严重）
  - label: 种类
    value: 台风、暴雨、暴雪、寒潮、大风、沙尘暴、高温、干旱、雷电、冰雹、霜冻、大雾、霾、道路结冰
  - label: 发布主体
    value: 各级气象主管机构所属气象台站
  - label: 传播义务
    value: 港口等公共场所管理单位应设置或利用设施传播预警信号
  sea_area: 全国
  as_of: '2026-11-03'
