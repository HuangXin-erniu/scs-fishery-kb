- id: KNO-HAZARD-004
  title: 预警信号的发布与传播
  summary: 预警信号由气象台站发布，公共场所负有传播义务。
  facts:
  - label: 发布主体
    value: 各级气象主管机构所属气象台站
  - label: 传播义务
    value: 港口、车站等人口密集公共场所管理单位应设置或利用设施传播
