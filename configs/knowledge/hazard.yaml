- id: KNO-HAZARD-003
  title: 预警信号的四级划分
  summary: 预警信号按危害程度分为四级。
  facts:
  - label: 级别
    value: Ⅳ级（一般）、Ⅲ级（较重）、Ⅱ级（严重）、Ⅰ级（特别严重）
  - label: 确定方式
    value: 按灾害种类特征与预警能力确定具体级别
