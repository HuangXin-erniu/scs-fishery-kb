- id: KNO-POLICY-003
  title: 2026 年伏季休渔专项捕捞品种
  summary: 2026 年南海区按品种专项捕捞许可的八个品种。
  facts:
  - label: 品种
    value: 海蜇、沙海蜇、口虾蛄、毛虾、鱿鱼、银鱼、丁香鱼、鸢乌贼
  - label: 作业条件
    value: 作业场所、时限、最大船数、捕捞限额、作业类型与最小网目由专项通告规定
  sea_area: 南海
  as_of: '2026-11-03'
