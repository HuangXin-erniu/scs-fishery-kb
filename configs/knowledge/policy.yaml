- id: KNO-POLICY-009
  title: 远洋渔船船位监测
  summary: 远洋渔船船位监测管理办法自 2020 年 1 月 1 日起执行。
  facts:
  - label: 施行
    value: 自2020年1月1日起执行
  - label: 适用
    value: 经批准从事远洋渔业生产的渔船（含辅助船）应安装船位监测设备并接入系统
  - label: 前身
    value: 2014 年办法同时废止
