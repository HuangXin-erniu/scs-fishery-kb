- id: KNO-POLICY-001
  title: 南海区伏季休渔时间与海域（2023 通告）
  summary: 2023 年通告规定南海区休渔海域、时间与小型张网规则。
  facts:
  - label: 休渔海域
    value: 北纬12度以北的南海（含北部湾）
  - label: 休渔时间
    value: 北纬26度30分至北纬12度：5月1日12时至8月16日12时
  - label: 小型张网
    value: 5月1日12时起，不少于3个月，结束时间由省级主管部门确定并报备
  - label: 捕捞辅助船
    value: 原则上执行所在海域最长休渔时间
  sea_area: 南海
  as_of: '2026-11-03'
  review_due: '2026-12-03'
  status: approved
  confidence: high
  sources:
  - doc: POL-CLOS-015
    sha256: 15660ed713803ff440da583e1d5a219ab5e488c2237f3bb33cd30e7115174bdc
    url: https://example.invalid/POL-CLOS-015
