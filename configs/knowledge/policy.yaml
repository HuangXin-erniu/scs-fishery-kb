- id: KNO-POLICY-002
  title: 申请渔业捕捞许可证需提交的材料
  summary: 《渔业捕捞许可证管理规定》第二十八条列出基础材料与海洋许可证附加材料。
  facts:
  - label: 基础材料
    value: 申请书；户口簿或营业执照；检验证书、国籍证书和所有权登记证书（徒手作业除外）；渔具和捕捞方法符合准用目录与技术标准的说明
  - label: 海洋许可证附加
    value: 渔业组织意见；首次或重新申请提供船网工具指标批准书；换发提供原捕捞许可证
  sea_area: 全国
  as_of: '2026-11-03'
  review_due: '2026-12-03'
  status: approved
  confidence: high
  sources:
  - doc: POL-STD-010
    sha256: 35e2069db4de910494c1e6e07c435c4aca91c846e912acba2d6178776b981910
    url: https://example.invalid/POL-STD-010
    publisher: 官网
