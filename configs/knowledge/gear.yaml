- id: KNO-GEAR-002
  title: 准用渔具最小网目标准
  summary: 2013 年通告附件1规定准用渔具的最小网目尺寸。
  facts:
  - label: 文件
    value: 海洋捕捞准用渔具最小网目（或网囊）尺寸相关标准（附件1）
  - label: 结构
    value: 按海域、渔具类别与主捕种类列最小网目
  - label: 示例
    value: 黄渤海刺网主捕梭子蟹、银鲳、海蜇为110毫米；主捕对虾、鱿鱼、虾蛄等为50毫米
  sea_area: 全国
