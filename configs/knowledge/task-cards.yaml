- id: TASK-OWNER-004
  persona: owner
  title: 船网工具指标申请与使用
  when: 2026年，全国
  steps:
  - text: 核对指标批准书有效期：制造、更新改造、进口渔船18个月；购置渔船6个月；可在届满前3个月内申请延展18个月；远洋特殊渔区可再延展18个月；逾期注销并收回指标。
    facts:
    - FACT-POLICY-006
  - text: 核对制造、更新改造规则：本省指标内通过淘汰旧船解决；船数和功率不得超过被淘汰渔船；大中型与小型不得转换；大中型不得跨海区买卖。
    facts:
    - FACT-POLICY-017
  documents: []
  deadline: ''
  facts:
  - FACT-POLICY-006
  - FACT-POLICY-017
