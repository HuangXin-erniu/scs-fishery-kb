- id: TASK-OWNER-003
  persona: owner
  title: 捕捞许可证换发与年审
  when: 2026年，全国
  steps:
  - text: 在期满前3个月内申请换发：使用期届满前3个月内向原发证机关申请换发；换发时收回原证并注销。
    facts:
    - FACT-POLICY-005
  - text: 核对年审条件：检验证书和国籍证书有效；所有人、主尺度、主机功率、总吨位未变更；作业类型、场所、时限、渔具数量一致；日志、资源费、处罚履行。
    facts:
    - FACT-POLICY-010
  documents: []
  deadline: ''
