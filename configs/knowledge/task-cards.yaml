- id: TASK-OWNER-002
  persona: owner
  title: 海洋渔业捕捞许可证申请
  when: 2026年，全国
  steps:
  - text: 准备申请材料：申请书、户口簿或营业执照、检验证书、国籍证书、所有权登记证书、渔具和捕捞方法说明；海洋许可另需组织意见、指标批准书或原证。
    facts:
    - FACT-POLICY-009
  - text: 确认许可证期限：海洋和内陆渔业捕捞许可证5年；其他种类最长不超过3年。
    facts:
    - FACT-POLICY-004
  documents: []
