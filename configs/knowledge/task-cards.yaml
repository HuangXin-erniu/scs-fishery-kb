- id: TASK-EXTENSION-001
  persona: extension
  title: 渔具分类、命名与代号
  when: 2026年，全国
  steps:
  - text: 使用规范分类：按GB/T 5147—2026的类、型、式分类和代号书写；名称按式+型+类书写，代号按类·型·式书写。
    facts:
    - FACT-GEAR-011
  - text: 使用标准类名称与代号：C刺网、W围网、T拖网、Zh张网、D钓具、Di地拉网、Ch抄网、Y掩罩、P耙刺、F敷网、X陷阱、L笼壶。
    facts:
    - FACT-GEAR-002
