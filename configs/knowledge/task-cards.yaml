- id: TASK-CAPTAIN-007
  persona: captain
  title: 渔业法基本义务与法律责任
  when: 2026年，全国
  steps:
  - text: 遵守捕捞许可证制度：国家对捕捞业实行捕捞许可证制度，捕捞许可证由县级以上人民政府渔业渔政主管部门批准发放。
    facts:
    - FACT-POLICY-035
  - text: 遵守捕捞限额制度：国家根据捕捞量低于渔业资源增长量的原则确定总可捕捞量，实行捕捞限额制度。
    facts:
    - FACT-POLICY-033
  - text: 按许可内容作业并填写日志：按许可证规定的作业类型、场所、时限、渔具数量和捕捞限额作业；海洋大中型渔业船舶应如实填写作业日志并至少保存二年。
    facts:
    - FACT-POLICY-037
  documents: []
