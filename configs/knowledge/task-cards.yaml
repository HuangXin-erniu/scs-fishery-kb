- id: TASK-CAPTAIN-005
  persona: captain
  title: 渔业行政处罚应对
  when: 2026年，全国
  steps:
  - text: 了解禁渔区、禁渔期违规后果：没收渔获物、违法所得和渔具，处20万元以下罚款；情节严重处20万元以上200万元以下罚款，吊销捕捞许可证，可以没收船舶。
    facts:
    - FACT-POLICY-011
  - text: 了解无证捕捞罚款：海洋水域10万元以下；内陆水域5万元以下。
    facts:
    - FACT-POLICY-012
