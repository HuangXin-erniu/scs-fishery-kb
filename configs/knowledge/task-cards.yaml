- id: TASK-CAPTAIN-002
  persona: captain
  title: 渔捞日志填报
  when: 2026年，全国
  steps:
  - text: 记录规定事项：记载捕捞作业、进港卸载渔获物、水上收购或转运渔获物等情况。
    facts:
    - FACT-POLICY-007
  - text: 避免违规：未按规定提交或填写不真实、不规范的，警告、责令改正；逾期不改正处1000元以上1万元以下罚款。
    facts:
    - FACT-POLICY-008
  documents: []
