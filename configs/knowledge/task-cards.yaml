- id: TASK-CAPTAIN-001
  persona: captain
  title: 南海伏季休渔合规自查
  when: 2026年，全国
  steps:
  - text: 确认作业类型是否属于休渔范围：除钓具外的所有作业类型，以及为捕捞渔船配套服务的捕捞辅助船，均纳入休渔管理。
    facts:
    - FACT-POLICY-002
  - text: 核对休渔时间与海域：南海区休渔时间为5月1日12时至8月16日12时，海域为北纬26度30分至北纬12度。
    facts:
    - FACT-POLICY-001
  - text: 识别违规后果：违反禁渔区、禁渔期规定捕捞的，面临没收渔获物、违法所得和渔具及罚款；情节严重的吊销捕捞许可证，可以没收船舶。
    facts:
    - FACT-POLICY-011
  documents:
  - 捕捞许可证
  - 船舶国籍证书
  deadline: 5月1日12时前完成休渔准备
  facts:
  - FACT-POLICY-001
  - FACT-POLICY-002
  - FACT-POLICY-011
  source:
    kind: playbook
    id: PLAY-CAPTAIN-001
  status: draft
  review_due: '2027-02-02'
  note: generated from an approved playbook; wording review pending
- id: TASK-OWNER-001
  persona: owner
  title: 2026年专项（特许）捕捞申请
  when: 2026年，全国
  steps:
  - text: 判断可申请的作业类型：桁杆拖虾、笼壶类、刺网、灯光围（敷）网4种作业类型，在指定海域和船籍港条件下可申请专项捕捞。
    facts:
    - FACT-POLICY-003
  - text: 准备申请材料：按捕捞许可证申请材料清单准备申请书、户口簿或营业执照、检验证书、国籍证书、所有权登记证书、渔具和捕捞方法说明等。
    facts:
    - FACT-POLICY-009
  - text: 核对证书有效期：许可证期满前3个月内向原发证机关申请换发，换发时收回原证并注销。
    facts:
    - FACT-POLICY-005
  documents: []
  deadline: ''
  facts:
  - FACT-POLICY-003
  - FACT-POLICY-005
  - FACT-POLICY-009
