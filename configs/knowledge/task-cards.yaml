- id: TASK-CAPTAIN-004
  persona: captain
  title: 渔具最小网目与准用/过渡渔具自查
  when: 2026年，全国
  steps:
  - text: 确认制度实施范围：2014年6月1日起，黄渤海、东海、南海全面实施最小网目尺寸制度。
    facts:
    - FACT-GEAR-001
  - text: 区分准用渔具与过渡渔具：准用渔具是国家允许使用的海洋捕捞渔具；过渡渔具按附件标准执行。
    facts:
    - FACT-GEAR-004
  - text: 按规定方法测量网目：按GB/T 6964—2010规定，采用扁平楔形网目内径测量仪测量，网目沿纵向或长轴方向充分拉直。
    facts:
    - FACT-GEAR-005
  documents: []
