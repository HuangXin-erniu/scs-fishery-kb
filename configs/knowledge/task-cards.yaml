  persona: extension
  title: 海洋捕捞统计口径说明
  when: 2026年，全国
  steps:
  - text: 说明海区口径：海洋捕捞产量按捕捞海域分为渤海、黄海、东海和南海区。
    facts:
    - FACT-STATS-001
  - text: 说明渔船分类口径：机动渔业船舶指依靠本船主机动力推进的渔业船舶，分为渔业生产船和渔业辅助船；捕捞船按主机功率、船长和作业方式分类。
