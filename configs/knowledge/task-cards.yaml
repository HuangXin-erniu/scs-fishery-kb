- id: TASK-CAPTAIN-003
  persona: captain
  title: 渔船进出渔港报告
  when: 2026年，全国
  steps:
  - text: 遵守渔港管理章程和避碰规则：进出渔港应遵守渔港管理章程和国际海上避碰规则，向渔政渔港监督管理机关报告，接受安全检查。
    facts:
    - FACT-POLICY-013
  - text: 认识未报告后果：未报告可责令改正，可以并处警告、罚款；情节严重的扣留或者吊销船长职务证书。
    facts:
    - FACT-POLICY-014
