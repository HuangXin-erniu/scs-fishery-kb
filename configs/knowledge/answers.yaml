answers:
- id: ANS-001
  question: 南海伏季休渔什么时候开始、什么时候结束？
  aliases:
  - 休渔期是哪几个月
  - 今年休渔到几号
  persona: captain
  answer: 5月1日12时至8月16日12时（北纬26度30分至北纬12度）
  evidence:
  - doc: POL-CLOS-015
    section: 三、休渔时间
    quote: 三、休渔时间 （一）北纬35度以北的渤海和黄海海域为5月1日12时至9月1日12时。 （二）北纬35度至北纬26度30分之间的黄海和东海海域为5月1日12时至9月16日12时。
      （三）北纬26度30分至北纬12度的东海和南海海域为5月1日12时至8月16日12时。 （四）北纬35度至北纬26度30分之间的黄海和东海海域桁杆拖虾、笼壶类、刺网和灯光围（敷）网4种作业类型渔船可申请开展虾蟹类、中上层鱼类等资源专项捕捞许可，由相关省份渔业主管部门核报农业农村部批准后执行。
      （五）特殊经济品种可执行专项捕捞许可制度，具体品种、作业时间、作业类型、作业海域由沿海各省、自治区、直辖市渔业主管部门报农业农村部批准后执行。 （六）小型张网渔船从5月1日12时起休渔，时间不少于三个月，休渔结束时间由沿海各省、自治区、直辖市渔业主管部门确定，报农业农村部备案。
      （七）捕捞辅助船原则上执行所在海域的最长休渔时间
  source:
    kind: faq
    id: FAQ-001
  status: approved
- id: ANS-002
  question: 休渔期间哪些作业类型不能出海？
  aliases:
  - 休渔管不管钓具
  - 辅助船要不要休渔
  persona: captain
  answer: 除钓具外的所有作业类型，以及为捕捞渔船配套服务的捕捞辅助船
  evidence:
  - doc: POL-CLOS-015
    section: 二、休渔作业类型
    quote: 二、休渔作业类型 除钓具外的所有作业类型，以及为捕捞渔船配套服务的捕捞辅助船。
  source:
    kind: faq
    id: FAQ-002
  status: approved
- id: ANS-003
  question: 休渔期哪些作业可以申请专项捕捞？
  aliases:
  - 专项证能捕什么
  - 特许捕捞有哪些作业类型
  persona: owner
  answer: 桁杆拖虾、笼壶类、刺网、灯光围（敷）网4种作业类型，在指定海域和船籍港条件下可申请专项捕捞
  evidence:
  - doc: POL-SPEC-041
    section: 二、按作业类型
    quote: 二、按作业类型(方式)专项捕捞许可2026年伏季休渔期间,同时满足以下条件的海洋捕捞渔船所有人可申请开展虾蟹类、中上层鱼类等资源专项捕捞。 (一)渔业捕捞许可证核定的作业类型(方式)为桁杆拖虾、笼壶类、刺网或者灯光围(敷)网。
      (二)渔业船舶所有权登记证书记载的船籍港在上海市、江苏省、浙江省或者福建省辖区内。 (三)渔业捕捞许可证核定的作业场所全部或者部分在北纬35度至北纬26度30分之间的黄海和东海海域。
      上述专项捕捞许可的作业场所、作业时限、最大船数、捕捞限额、最小网目尺寸和定点上岸渔港等详见附件2。
  source:
    kind: faq
    id: FAQ-003
  status: approved
- id: ANS-004
  question: 渔业捕捞许可证能用几年？
  aliases:
  - 捕捞证有效期多久
  - 许可证到期时间
  persona: owner
  answer: 海洋和内陆渔业捕捞许可证5年；其他种类最长不超过3年
  evidence:
  - doc: POL-STD-010
    section: 第三十五条
    quote: 第三十五条 海洋渔业捕捞许可证和内陆渔业捕捞许可证的使用期限为5年。其他种类渔业捕捞许可证的使用期限根据实际需要确定，但最长不超过3年。 使用达到农业农村部规定的老旧渔业船舶船龄的渔船从事捕捞作业的，发证机关核发其渔业捕捞许可证时，证书使用期限不得超过渔业船舶检验证书记载的有效期限。
  source:
    kind: faq
    id: FAQ-004
  status: approved
- id: ANS-005
  question: 捕捞许可证到期怎么换证？
  aliases:
  - 换证要提前多久
  - 捕捞证到期怎么办
  persona: owner
  answer: 使用期届满前3个月内向原发证机关申请换发；换发时收回原证并注销
  evidence:
  - doc: POL-STD-010
    section: 第三十六条
    quote: 第三十六条 渔业捕捞许可证使用期届满，或者在有效期内有下列情形之一的，应当按规定申请换发渔业捕捞许可证： （一）因行政区划调整导致船名变更、船籍港变更的；
      （二）作业场所、作业方式变更的； （三）船舶所有人姓名、名称或地址变更的，但渔船所有权发生转移的除外； （四）渔业捕捞许可证污损不能使用的。 渔业捕捞许可证使用期届满的，船舶所有人应当在使用期届满前3个月内，向原发证机关申请换发捕捞许可证。发证机关批准换发渔业捕捞许可证时，应当收回原渔业捕捞许可证，并予以注销。
  source:
    kind: faq
    id: FAQ-005
  status: approved
- id: ANS-006
  question: 船网工具指标批准书有效期多久？
  aliases:
  - 指标书多久过期
  - 造船指标能延吗
  persona: owner
  answer: 制造、更新改造、进口渔船18个月；购置渔船6个月；可在届满前3个月内申请延展18个月；远洋特殊渔区可再延展18个月；逾期注销并收回指标
  evidence:
  - doc: POL-STD-010
    section: 第十六条
    quote: 第十六条 申请人应当凭渔业船网工具指标批准书办理渔船制造、更新改造、购置或进口手续，并申请渔船检验、登记，办理渔业捕捞许可证。 制造、更新改造、进口渔船的渔业船网工具指标批准书的有效期为18个月，购置渔船的渔业船网工具指标批准书的有效期为6个月。因特殊原因在规定期限内无法办理完毕相关手续的，可在有效期届满前3个月内申请有效期延展18个月。
      已开工建造的到特殊渔区作业的专业远洋渔船，在延展期内仍无法办理完毕相关手续的，可在延展期届满前3个月内再申请延展18个月，且不得再次申请延展。 船网工具指标批准书有效期届满未依法延续的，审批机关应当予以注销并收回船网工具指标。
  source:
    kind: faq
    id: FAQ-006
  status: approved
- id: ANS-007
  question: 渔捞日志要记哪些内容？
  aliases:
  - 日志写什么
  - 捕捞日志记录哪些情况
  persona: captain
  answer: 捕捞作业、进港卸载渔获物、水上收购或转运渔获物等情况
  evidence:
  - doc: POL-STD-010
    section: 第五十条
    quote: 第五十条 海洋大中型渔船从事捕捞活动应当填写渔捞日志，渔捞日志应当记载渔船捕捞作业、进港卸载渔获物、水上收购或转运渔获物等情况。其他渔船渔捞日志的管理由省、自治区、直辖市人民政府规定。
  source:
    kind: faq
    id: FAQ-007
  status: approved
- id: ANS-008
  question: 渔捞日志不填或填错会怎么处罚？
  aliases:
  - 日志漏填罚多少
  - 日志填错后果
  persona: captain
  answer: 未按规定提交或填写不真实、不规范的，警告、责令改正；逾期不改正处1000元以上1万元以下罚款
  evidence:
  - doc: POL-STD-010
    section: 第五十三条
    quote: 第五十三条 未按规定提交渔捞日志或者渔捞日志填写不真实、不规范的，由县级以上人民政府渔业主管部门或其所属的渔政监督管理机构给予警告，责令改正；逾期不改正的，可以处1000元以上1万元以下罚款。
  source:
    kind: faq
    id: FAQ-008
  status: approved
- id: ANS-009
  question: 申请捕捞许可证要准备哪些材料？
  aliases:
  - 办捕捞证带什么
  - 许可证申请材料
  persona: owner
  answer: 申请书、户口簿或营业执照、检验证书、国籍证书、所有权登记证书（徒手作业除外）、渔具和捕捞方法说明；海洋许可另需组织意见、指标批准书或原证
  evidence:
  - doc: POL-STD-010
    section: 第二十八条
    quote: 第二十八条 申请渔业捕捞许可证，申请人应当向户籍所在地、法人或非法人组织登记地县级以上人民政府渔业主管部门提出申请，并提交下列资料： （一）渔业捕捞许可证申请书；
      （二）船舶所有人户口簿或者营业执照； （三）渔业船舶检验证书、渔业船舶国籍证书和所有权登记证书，徒手作业的除外； （四）渔具和捕捞方法符合渔具准用目录和技术标准的说明。
      申请海洋渔业捕捞许可证，除提供第一款规定的资料外，还应提供： （一）申请人所属渔业组织出具的意见； （二）首次申请和重新申请捕捞许可证的，提供渔业船网工具指标批准书；
      （三）申请换发捕捞许可证的，提供原捕捞许可证。 申请公海渔业捕捞许可证，除提供第一款规定的资料外，还需提供： （一）农业农村部远洋渔业项目批准文件； （二）首次申请和重新申请的，提供渔业船网工具指标批准书；
      （三）非专业远洋渔船需提供海洋渔业捕捞许可证暂存的凭据。 申请专项（特许）渔业捕捞许可证，
  source:
    kind: faq
    id: FAQ-009
  status: approved
- id: ANS-010
  question: 禁渔期出海捕捞会怎么处罚？
  aliases:
  - 休渔期捕鱼罚多少
  - 禁渔期被抓怎么处理
  persona: captain
  answer: 没收渔获物、违法所得和渔具，处20万元以下罚款；情节严重处20万元以上200万元以下罚款，吊销捕捞许可证，可以没收船舶
  evidence:
  - doc: POL-LAW-009
    section: 第七十八条
    quote: 第七十八条 违反本法规定，有下列情形之一的，没收渔获物、违法所得和渔具，并处二十万元以下的罚款；情节严重的，并处二十万元以上二百万元以下的罚款，吊销捕捞许可证，可以没收船舶：
      （一）违反禁渔区、禁渔期的规定从事捕捞活动； （二）使用禁用的渔具、小于最小网目尺寸的网具进行捕捞； （三）渔获物中幼鱼超过规定比例。 渔业船舶违反禁渔区、禁渔期的规定航行、停泊的，处二十万元以下的罚款。
      在禁渔区、禁渔期违规垂钓的，没收渔获物、违法所得和渔具，可以并处五万元以下的罚款。 辅助捕捞作业的船舶携带渔具航行、停泊未进行捆扎、覆盖的，处五万元以下的罚款，并可以没收渔具；情节严重的，处五万元以上二十万元以下的罚款。
  source:
    kind: faq
    id: FAQ-010
  status: approved
- id: ANS-011
  question: 无证捕捞罚多少钱？
  aliases:
  - 没有捕捞证罚多少
  - 无证捕鱼罚款
  persona: owner
  answer: 海洋水域10万元以下；内陆水域5万元以下
  evidence:
  - doc: POL-PEN-080
    section: 第八条
    quote: 第八条 按照《渔业法》第四十一条规定，对未取得捕捞许可证擅自进行捕捞的，没收渔获物和违法所得，并处罚款；情节严重的，并可以没收渔具和渔船。罚款按下列标准执行：
      （一）在内陆水域，处以五万元以下罚款。 （二）在海洋水域，处以十万元以下罚款。 无正当理由不能提供渔业捕捞许可证的，按本条前款规定处罚。
  source:
    kind: faq
    id: FAQ-011
  status: approved
- id: ANS-012
  question: 渔船进出渔港要办什么手续？
  aliases:
  - 进出港要报告吗
  - 渔港进出港规定
  persona: captain
  answer: 遵守渔港管理章程和国际海上避碰规则，向渔政渔港监督管理机关报告，接受安全检查
  evidence:
  - doc: POL-PORT-077
    section: 第六条
    quote: 第六条 船舶进出渔港必须遵守渔港管理章程以及国际海上避碰规则，并依照规定向渔政渔港监督管理机关报告，接受安全检查。 渔港内的船舶必须服从渔政渔港监督管理机关对水域交通安全秩序的管理。
  source:
    kind: faq
    id: FAQ-012
  status: approved
- id: ANS-013
  question: 渔业船舶检验分几种？
  aliases:
  - 船检有哪几类
  - 渔船多久检验一次
  persona: owner
  answer: 强制检验分为初次检验、营运检验和临时检验
  evidence:
  - doc: POL-RULE-019
    section: 第四条
    quote: 第四条 国家对渔业船舶实行强制检验制度。强制检验分为初次检验、营运检验和临时检验。
  source:
    kind: faq
    id: FAQ-013
  status: approved
- id: ANS-014
  question: 渔业资源增殖保护费按什么标准收？
  aliases:
  - 资源费怎么算
  - 增殖保护费比例
  persona: owner
  answer: 海洋渔业按前3年平均年总产值1%至3%（不含专项品种）；专项品种3%至5%
  evidence:
  - doc: POL-RULE-020
    section: 第五条
    quote: 第五条 渔业资源费分为海洋渔业资源费和内陆水域渔业资源费。 海洋渔业资源费年征收金额，由沿海省级人民政府渔业行政主管部门或者海区渔政监督管理机构，在其批准发放捕捞许可证的渔船前3年采捕水产品的平均年总产值(不含专项采捕经济价值较高的渔业资源品种产值)1%至3%的幅度内确定。
      内陆水域渔业资源费年征收金额由省级人民政府确定。 专项采捕经济价值较高的渔业资源品种，渔业资源费年征收金额，由省级人民政府渔业行政主管部门或者海区渔政监督管理机构，在其批准发放捕捞许可证的渔船前3年采捕该品种的平均年总产值3%至5%的幅度内确定。
      经济价值较高的渔业资源品种名录，由国务院渔业行政主管部门确定。
  source:
    kind: faq
    id: FAQ-014
  status: approved
