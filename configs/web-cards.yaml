  file: WEB-GOV-CMA-WARNING-2007/text.txt
  status: ok
  excerpt: 第一条 为了规范气象灾害预警信号发布与传播，防御和减轻气象灾害，保护国家和人民生命财产安全，依据《中华人民共和国气象法》、《国家突发公共事件总体应急预案》，制定本办法。
    第二条 在中华人民共和国领域和中华人民共和国管辖的其他海域发布与传播气象灾害预警信号，必须遵守本办法。 本办法所称气象灾害预警信号（以下简称预警信号），是指各级气象主管机构所属的气象台站向社会公众发布的预警信息。
    预警信号由名称、图标、标准和防御指南组成，分为台风、暴雨、暴雪、寒潮、大风、沙尘暴、高温、干旱、雷电、冰雹、霜冻、大雾、霾、道路结冰等。 第三条 预警信号的级别依据气象灾害可能造成的危害程度、紧急程度和发展态势一般划
