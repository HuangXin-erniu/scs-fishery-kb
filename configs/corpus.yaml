gaps:
- Forty-two sources are registered: thirty-three acquired and nine candidates awaiting disposition.
- The yearbook coverage matrix has no values in the public repository; all values stay local.
- The yearbook infrastructure table is missing for data years 2018 and 2019; the 2018 national port plan supplies a baseline whose port classes are close to, but not identical with, the yearbook table.
- The vessel-length proxy is missing for data year 2024.
- The statistical indicator definitions are still a candidate; the sampling standard and the permit form now answer the operation-type and logbook questions in part.
- The core indicator CSV and the sufficiency review are the next data-preparation steps.
next_steps:
- Review the local core indicator CSV against the new standards and the permit form, and accept or reject its sufficiency.
- Acquire the statistical indicator definitions; the standard series points to GB/T 5147—2003 for gear classification.
- Diff the registered Fisheries Law text against the npc.gov.cn page when that site is reachable again.
- Do not plan the pipeline until the core matrix is accepted as sufficient.
