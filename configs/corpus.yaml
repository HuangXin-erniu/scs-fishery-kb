gaps:
- Eight yearbook editions are registered as acquired internal sources; ten candidates remain to_acquire.
- The yearbook coverage matrix has no values in the public repository; all values stay local.
- Infrastructure tables are missing for data years 2018 and 2019; the vessel-length proxy is missing for data year 2024.
- Operation/logbook/gear standards and the official Fisheries Law standard text are still pending.
- The core indicator CSV and the sufficiency review are the next data-preparation steps.
next_steps:
- Build the local long-table core indicator CSV and the coverage/sufficiency report.
- Replace the Fisheries Law reprint with the official standard text.
- Search official national/provincial candidates for operations, logbook and gear sources; present before registration.
- Do not plan the pipeline until the core matrix is accepted as sufficient.
