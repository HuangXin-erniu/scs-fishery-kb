# Local data root: $SCS_FKB_DATA_ROOT. The public tree contains no payload.

schema_version: 1
updated_at: '2026-10-31'
data_root: null
data_root_env: SCS_FKB_DATA_ROOT
policy:
  ingest_requires:
  - file_available
  - license_known
  - sensitivity_known
  allowed_license:
  - public
  - internal
  - restricted
  allowed_sensitivity:
  - public
  - internal
  - restricted
  unknown_action: hold
  restricted_external_api: false
  notes: Sources with an unknown licence or sensitivity are held and must not be ingested; restricted sources stay local.
