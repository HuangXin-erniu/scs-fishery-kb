schema_version: 1
updated_at: "2026-10-31"

# Local only; the data root is outside the repository and is never committed.
data_root: null
data_root_env: "SCS_FKB_DATA_ROOT"

policy:
  ingest_requires:
    - file_available
    - license_known
    - sensitivity_known
  allowed_license:
    - public
    - internal
    - restricted
  allowed_sensitivity:
    - public
    - internal
    - restricted
  unknown_action: hold
  restricted_external_api: false
  notes: "Sources with an unknown licence or sensitivity are held and must not be ingested; restricted sources stay local."

categories:
  - id: fishery_operations
    name: "Fishing vessel operations and catch statistics"
    name_zh: "渔船作业与渔获统计"
    description: "Statistical yearbooks, logbook specifications, operation types and catch indicators."
  - id: vessel_tracks
    name: "Vessel/voyage data dictionaries and sample descriptions"
    name_zh: "船位/航次数据字典与样本说明"
    description: "AIS/VMS field definitions, voyage definitions and desensitised sample descriptions; no full tracks."
  - id: ocean_fishery_products
    name: "Ocean and fishery product descriptions"
    name_zh: "海洋环境与渔情产品说明"
    description: "Product descriptions, indicators and metadata for SST, chlorophyll, currents and wind; no raw grids."
  - id: forecast_bulletins
    name: "Fishing-ground and season bulletins"
    name_zh: "渔场/渔汛预报与通报"
    description: "Public bulletins, historical season records and fishing-ground descriptions; no forecast model outputs."
  - id: policy_standards
    name: "Laws, regulations, operational norms and standards"
    name_zh: "政策法规、作业规范与标准"
    description: "Fisheries law, seasonal closures, access conditions, operational norms and gear standards."
  - id: papers_reports
    name: "Papers, reports and monographs"
    name_zh: "论文、报告、专著"
    description: "Journal papers, project reports, technical reports and monographs that can be used lawfully."
  - id: data_dictionary
    name: "Data dictionaries and statistical definitions"
    name_zh: "数据字典与统计口径"
    description: "Field definitions, indicator definitions, metadata and data-quality rules."

