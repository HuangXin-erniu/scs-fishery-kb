gaps:
- Thirty-six sources are registered: twenty-seven acquired and nine candidates awaiting disposition.
- The yearbook coverage matrix has no values in the public repository; all values stay local.
- Infrastructure tables are missing for data years 2018 and 2019; the vessel-length proxy is missing for data year 2024.
- The statistical indicator definitions, the logbook/operations specification and any standard source are still pending; the national bulletins report totals only.
- The core indicator CSV and the sufficiency review are the next data-preparation steps.
next_steps:
- Review the local core indicator CSV and accept or reject its sufficiency.
- Acquire the statistical indicator definitions and search official national and provincial sources for the logbook and operations specification; present before registration.
- Diff the registered Fisheries Law text against the npc.gov.cn page when that site is reachable again.
- Do not plan the pipeline until the core matrix is accepted as sufficient.
