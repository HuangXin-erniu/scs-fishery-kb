  license: public
  sensitivity: public
  status: acquired
  priority: P1
  volume: 1 PDF; 16 pages, printed pages 144-159
  update_freq: annual
  hash: 8f67eebf4ffdf4d834d5034ab6cd131486dfa3db4fe564e9e42eea67c4244567
  acquisition: 'Owner-supplied 2024 yearbook PDF; pages 164-179 of that file were separated into this extract with poppler pdfseparate and pdfunite on 2026-11-01. Source file SHA-256: 43f94599c25c29d8676ae01669fc9b8715becaa34c882bc790e4d61ca2799d3d.'
  notes: 'Appendix 3 of the fisheries yearbook. Defines the water-product concept and scope, the statistical year and reporting unit, the measurement basis (fresh weight, except salted jellyfish and dried algae), the culture-versus-capture rule, product classification, marine and freshwater culture classes, and capture production by sea area (Bohai, Yellow, East China and South China Sea boundaries) and by gear group (trawl, purse seine, gillnet, stow net, hook and line, other). This is the authoritative definition source for production questions.'
- id: DICT-STAT-040
  title: 中国统计年鉴2025主要统计指标解释（农业）
