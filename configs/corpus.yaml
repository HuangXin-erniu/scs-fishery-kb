  acquisition: 'Owner-supplied OFD received 2026-11-01, byte-identical to the official attachment https://www.moa.gov.cn/govpublic/YYJ/202604/P020260424354196891178.ofd linked from https://www.moa.gov.cn/govpublic/YYJ/202604/t20260424_6483594.htm (农业农村部通告〔2026〕2号, published 2026-04-21).'
  notes: '2026 closed-season special-permit arrangement issued under the 2023 closure notice (POL-CLOS-015) and the fishing-permit regulation. Annex 1 admits Sthenoteuthis oualaniensis permits in the South China Sea for Guangxi (36 vessels, 2,500 t, 20 June to 5 August, mask net 35 mm, Beihai Nanwan port) and Hainan (70 vessels, 5,000 t, 1 May to 15 August, mask net 35 mm, Sanya Yazhou, Qionghai Tanmen and Danzhou Baimajing central ports). Annex 2 operation-type permits cover only the Yellow and East China Seas north of 26 30 N. Annex 3 gives 26 Hainan auxiliary vessels serving the squid permit, landing at the three central ports plus the Sansha West fishing quay. The OFD is an XML container whose text layer extracts without OCR.'
