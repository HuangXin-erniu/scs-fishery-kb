  volume: 1 PDF; 1 page
  update_freq: annual
  hash: 5ee68c21d985c31f0fe5e0163965d2c8234ba6227fc96b8b4d8d8667d93b1acc
  acquisition: 'Chapter-12 indicator notes fetched 2026-11-01 from the National Bureau of Statistics: https://www.stats.gov.cn/sj/ndsj/2025/html/zb12.pdf (HTTP 200). The 2023 and 2024 editions carry the same text.'
  notes: 'National statistical definition: water-product output is the final effective output of capture and culture, covering marine and freshwater fish, crustaceans, shellfish, cephalopods, algae and other products; the data are reported upward through fishery departments at each level; since 1996 shellfish are measured by fresh weight. It does not split marine capture production, so DICT-STAT-013 remains the operational definition for sea-area and gear breakdowns.'
