# Corpus register. English is the canonical documentation language.
# Data values are not stored here; only source metadata, hashes and coverage notes.
# Local data root: $SCS_FKB_DATA_ROOT. The public tree contains no payload.

schema_version: 1
updated_at: '2026-10-31'
data_root: null
data_root_env: SCS_FKB_DATA_ROOT
policy:
  ingest_requires:
  - file_available
  - license_known
  - sensitivity_known
  allowed_license:
  - public
  - internal
  - restricted
  allowed_sensitivity:
  - public
  - internal
  - restricted
  unknown_action: hold
  restricted_external_api: false
  notes: Sources with an unknown licence or sensitivity are held and must not be ingested; restricted sources stay local.
types:
- id: statistical_yearbook
  name: Statistical yearbook
  name_zh: 统计年鉴
  description: Official annual fishery statistics and indicator tables.
- id: operations
  name: Operations knowledge
  name_zh: 作业知识
  description: Fishing methods, gear, vessel operations, logbooks and permit conditions.
- id: law
  name: Law
  name_zh: 法律
  description: National laws adopted by the legislature.
- id: regulation
  name: Administrative regulation
  name_zh: 行政法规/规章
  description: Administrative regulations, departmental rules and implementing provisions.
- id: notice
  name: Notice or announcement
  name_zh: 通告/公告
  description: Official notices, announcements and seasonal management measures.
- id: standard
  name: Standard or norm
  name_zh: 标准/规范
  description: National, industry or provincial standards and operational norms.
- id: fishery_product
  name: Fishery or ocean product description
  name_zh: 渔情/海况产品说明
  description: Product descriptions, fishery bulletins and historical season records.
- id: data_dictionary
  name: Data dictionary
  name_zh: 数据字典
  description: Field definitions, indicator definitions, metadata and quality rules.
