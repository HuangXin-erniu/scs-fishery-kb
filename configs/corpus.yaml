- id: law
  name: Law
  name_zh: 法律
  description: National laws adopted by the legislature.
- id: regulation
  name: Administrative regulation
  name_zh: 行政法规/规章
  description: Administrative regulations, departmental rules and implementing provisions.
- id: notice
  name: Notice or announcement
  name_zh: 通告/公告
  description: Official notices, announcements and seasonal management measures.
- id: standard
  name: Standard or norm
  name_zh: 标准/规范
