schema_version: 1
updated_at: 2026-11-01
# Gold anchors for the anchor-level evaluation. A question counts as retrieved
# when a top-5 chunk matches any of its anchors: the document must agree, and
# the section (prefix match) or the page must agree when an anchor names one.
anchors:
  Q-E01:
    - {doc: POL-CLOS-015, section: "三、休渔时间"}
    - {doc: POL-CLOS-015, section: "一、休渔海域"}
  Q-E02:
    - {doc: POL-STD-010, section: "第二十六条"}
    - {doc: POL-SPEC-041, section: "二、按作业类型"}
  Q-E03:
    - {doc: POL-STD-010, section: "第五十条"}
    - {doc: POL-LAW-009, section: "第三十四条"}
  Q-E04:
    - {doc: POL-LAW-009, section: "第七十四条"}
    - {doc: POL-STD-010, section: "第五十三条"}
  Q-E09:
    - {doc: POL-STD-010, section: "第二十八条"}
    - {doc: POL-LAW-009, section: "第三十五条"}
  Q-E10:
    - {doc: POL-GEAR-033}
    - {doc: POL-GEAR-034}
  Q-E12:
    - {doc: POL-LAW-009, section: "第七十八条"}
  Q-M01:
    - {doc: POL-LAW-009, section: "第四十四条"}
    - {doc: POL-CLOS-015, section: "四、实施时间"}
  Q-M03:
    - {doc: POL-STD-010, section: "第五十一条"}
    - {doc: POL-STD-010, section: "第五十二条"}
  Q-M10:
    - {doc: POL-STD-010, section: "第二十八条"}
    - {doc: POL-LAW-009, section: "第三十五条"}
  Q-M12:
    - {doc: POL-STD-010, section: "第二十六条"}
    - {doc: POL-LAW-009, section: "第七十八条"}
abstention:
  - Q-E07
  - Q-E11
  - Q-M07
  - Q-M08
# Definition and product questions answered through reference collections rather than the main
# ranked index. Each entry declares its collection.
reference:
  - id: Q-E05
    collection: cwp
    docs: [STD-CWP-043-catch, STD-CWP-043-effort]
  - id: Q-M04
    collection: cwp
    docs: [STD-CWP-043-catch, STD-CWP-043-effort]
  - id: Q-E08
    collection: product
    docs: [STD-MUR-045, STD-OLCI-046]
  - id: Q-M09
    collection: product
    docs: [STD-MUR-045, STD-OLCI-046, STD-CMEMS-049]
# Statistical questions answered through the local yearbook channel rather than
# the public index. The channel is scored separately from the main metrics.
statistics:
  - id: Q-E06
    query: 南海区海洋捕捞产量历年趋势
    expect: capture_production_sea_area
  - id: Q-M05
    query: 2019年南海区拖网渔船数量
    expect: vessel_count
