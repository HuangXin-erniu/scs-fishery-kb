# Definition and product questions answered through reference collections rather than the main
# ranked index. Each entry declares its collection.
reference:
  - id: Q-E05
    collection: cwp
    docs: [STD-CWP-043-catch, STD-CWP-043-effort]
  - id: Q-M04
    collection: cwp
    docs: [STD-CWP-043-catch, STD-CWP-043-effort]
# Product questions are deferred to the web channel; none is scored in v1.
web: []

# Statistical questions answered through the local yearbook channel rather than
# the public index. The channel is scored separately from the main metrics.
statistics:
  - id: Q-E06
    query: 南海区海洋捕捞产量历年趋势
    expect: capture_production_sea_area
  - id: Q-M05
    query: 2019年南海区拖网渔船数量
    expect: vessel_count

# Jurisdiction questions answered through the policy reference collection. They are scored
# separately because they exercise the province-first re-ranking and the answer lead.
jurisdiction:
  - id: J1
    query: 海南省2026年伏季休渔的时间和海域是什么？
    docs: [POL-HN-059]
  - id: J2
    query: 广西2026年海洋伏季休渔的时间与要求是什么？
    docs: [POL-GX-060]
  - id: J3
    query: 汕头市2026年海洋伏季休渔有哪些管理要求？
    docs: [POL-GD-061]

# National-layer questions answered through the policy collection. They are scored separately
# because they exercise the national-first ordering.
national:
  - id: J4
    query: 2026年海洋伏季休渔执法行动由哪些部门开展、重点任务是什么？
    docs: [POL-ENF-068]
  - id: J5
    query: 远洋渔船标准化船型参数系列表（2024年版）有哪些船型和参数？
    docs: [STD-YY-071]

# Owner-reviewed gold answer points. Batch 1 (Q-E01 to Q-E08) was approved by the
# project owner on 2026-11-04. The points are paraphrases, not verbatim source text.
gold:
  Q-E01:
    points:
      - "南海区休渔时间为5月1日12时至8月16日12时（北纬26度30分至12度的东海和南海海域）。"
      - "休渔作业类型为除钓具外的所有作业类型，以及为捕捞渔船配套服务的捕捞辅助船。"
    evidence:
      - {doc: POL-CLOS-015, section: "三、休渔时间"}
      - {doc: POL-CLOS-015, section: "二、休渔作业类型"}
  Q-E02:
    points:
      - "钓具不纳入休渔；桁杆拖虾、笼壶类、刺网和灯光围（敷）网4种作业类型可申请虾蟹类、中上层鱼类等专项捕捞许可。"
      - "专项捕捞需取得专项（特许）渔业捕捞许可证。"
    evidence:
      - {doc: POL-CLOS-015, section: "三、休渔时间"}
      - {doc: POL-SPEC-041, section: "二、按作业类型"}
      - {doc: POL-STD-010, section: "第二十六条"}
  Q-E03:
    points:
      - "海洋大中型渔船从事捕捞活动应当填写渔捞日志，记载捕捞作业、进港卸载渔获物、水上收购或转运渔获物等情况。"
      - "船长对渔捞日志记录内容的真实性、正确性负责。"
    evidence:
      - {doc: POL-STD-010, section: "第五十条"}
      - {doc: POL-STD-010, section: "第五十二条"}
  Q-E04:
    points:
      - "未按规定提交渔捞日志或者填写不真实、不规范的，给予警告、责令改正。"
      - "逾期不改正的，可以处1000元以上1万元以下罚款。"
    evidence:
      - {doc: POL-STD-010, section: "第五十三条"}
  Q-E05:
    points:
      - "CWP口径：catch为捕捞活动捕获的水生生物总活重；landings为实际卸岸的渔获重量。"
      - "fishing effort为特定渔具在渔场一定时间内的投入量，例如作业持续时间或航次。"
    evidence:
      - {doc: STD-CWP-043-catch}
      - {doc: STD-CWP-043-effort}
    note: "International reference only; the Chinese official definition covers production."
  Q-E06:
    points:
      - "返回南海区海洋捕捞产量2017至2025年按海区的年度序列，并带年鉴版次与表名引用。"
      - "年鉴不发布按作业类型的产量，回答必须说明该维度缺失。"
    evidence:
      - {doc: STAT-YB-2018}
      - {doc: STAT-YB-2025}
    channel: statistics
  Q-E07:
    abstain: true
    reason: "no registered source covers historical fishing seasons; the system must refuse."
  Q-E08:
    deferred: true
    reason: "parked for the web channel; not scored in v1."
  Q-E09:
    points:
      - "许可证有效期内，作业场所、作业方式变更的，应当申请换发渔业捕捞许可证。"
      - "有效期届满前3个月内向原发证机关申请换发；换发时收回原证并注销。"
    evidence:
      - {doc: POL-STD-010, section: "第三十六条"}
  Q-E10:
    points:
      - "自2014年6月1日起，黄渤海、东海、南海三个海区全面实施海洋捕捞准用渔具和过渡渔具最小网目尺寸制度。"
      - "具体最小网目尺寸标准见通告附件1和附件2；省级主管部门可制定更严格标准。"
    evidence:
      - {doc: POL-GEAR-016, section: "一、实行时间和范围"}
      - {doc: POL-GEAR-016, section: "二、主要内容"}
  Q-E11:
    abstain: true
    reason: "no registered source covers fishery-bulletin interpretation; the system must refuse."
  Q-E12:
    points:
      - "违反禁渔区、禁渔期规定从事捕捞的，没收渔获物、违法所得和渔具，并处20万元以下罚款。"
      - "情节严重的，并处20万元以上200万元以下罚款，吊销捕捞许可证，可以没收船舶；违规航行、停泊的处20万元以下罚款。"
    evidence:
      - {doc: POL-LAW-009, section: "第七十八条"}
  Q-E13:
    points:
      - "年审需持有效渔业船舶检验证书和国籍证书，船舶所有人、主尺度、主机功率、总吨位未变更。"
      - "作业类型、场所、时限、渔具数量与许可内容一致，按规定填写提交渔捞日志、缴纳渔业资源增殖保护费并履行处罚决定。"
    evidence:
      - {doc: POL-STD-010, section: "第四十一条"}
  Q-E14:
    points:
      - "制造、更新改造国内海洋捕捞渔船，应在本省船网工具控制指标内通过淘汰旧船解决，船数和功率数不得超过被淘汰渔船。"
      - "大中型与小型指标不得相互转换；购置指标随船转移；大中型不得跨海区买卖；转远洋经批准可保留指标（重大改造导致主尺度、功率、作业类型变更的除外）。"
    evidence:
      - {doc: POL-STD-010, section: "第十四条"}
  Q-E15:
    points:
      - "船舶进出渔港必须遵守渔港管理章程和国际海上避碰规则，并按规定向渔政渔港监督管理机关报告，接受安全检查。"
      - "未报告的，责令改正，可以并处警告、罚款；情节严重的，扣留或者吊销船长职务证书。"
    evidence:
      - {doc: POL-PORT-077, section: "第六条"}
      - {doc: POL-PORT-077, section: "第二十条"}
  Q-M01:
    points:
      - "现行法律依据是渔业法（2025年修订，2026年5月1日施行）第四十四条：省级以上渔业渔政主管部门设立并公布禁渔区、禁渔期。"
      - "南海区具体休渔安排由农业农村部2023年通告调整（5月1日12时至8月16日12时），并取代2021年通告；2026年另有专项捕捞许可通告。"
    evidence:
      - {doc: POL-LAW-009, section: "第四十四条"}
      - {doc: POL-CLOS-015, section: "四、实施时间"}
  Q-M02:
    abstain: true
    reason: "no registered vessel-management dictionary; the system must refuse."
  Q-M03:
    points:
      - "公海捕捞作业渔船应当每月向农业农村部或其指定机构提交渔捞日志。"
      - "未按规定提交或填写不真实、不规范的，给予警告、责令改正；逾期不改正的处1000元以上1万元以下罚款。"
    evidence:
      - {doc: POL-STD-010, section: "第五十一条"}
      - {doc: POL-STD-010, section: "第五十三条"}
  Q-M04:
    points:
      - "CWP区分catch（捕获总活重）、landings（实际卸岸重量）和fishing effort（渔具在渔场一定时间内的投入量）。"
      - "中国官方统计只对产量作出定义，上岸量和捕捞努力量没有同等的官方口径。"
    evidence:
      - {doc: STD-CWP-043-catch}
      - {doc: STD-CWP-043-effort}
    note: "Reference collection; the Chinese official definition covers production only."
  Q-M05:
    points:
      - "返回2019年南海区拖网渔船数量，并带年鉴版次和表名引用。"
      - "产量与船数不能按作业类型同时给出：年鉴不发布按作业类型的捕捞产量。"
    evidence:
      - {doc: STAT-YB-2020}
    channel: statistics
  Q-M06:
    abstain: true
    reason: "no registered vessel/voyage dictionary; the system must refuse."
  Q-M07:
    abstain: true
    reason: "no registered fishery-bulletin source; the system must refuse."
  Q-M08:
    abstain: true
    reason: "no registered historical fishing-ground record; the system must refuse."
  Q-M09:
    deferred: true
    reason: "parked for the web channel; not scored in v1."
  Q-M10:
    points:
      - "申请海洋渔业捕捞许可证应提交申请书、所有人户口簿或营业执照、渔业船舶检验证书、国籍证书和所有权登记证书，以及渔具和捕捞方法符合准用目录与技术标准的说明。"
      - "海洋渔业许可另需渔业组织意见、船网工具指标批准书（首次或重新申请）或原捕捞许可证（换发）。"
    evidence:
      - {doc: POL-STD-010, section: "第二十八条"}
  Q-M11:
    abstain: true
    reason: "no registered metadata/attribution rule; the system must refuse."
  Q-M12:
    points:
      - "专项（特许）捕捞需按第二十六条申请专项许可证；休渔期作业还需提供作业事由和计划。"
      - "违反禁渔区、禁渔期规定的，按第七十八条没收渔获物、违法所得和渔具并处罚款，情节严重的吊销许可证。"
    evidence:
      - {doc: POL-STD-010, section: "第二十六条"}
      - {doc: POL-LAW-009, section: "第七十八条"}
  Q-M13:
    points:
      - "换发情形：行政区划调整导致船名或船籍港变更，作业场所或作业方式变更，所有人姓名/名称/地址变更（所有权转移除外），证件污损；期满前3个月内申请。"
      - "重新申请情形：作业类型变更，主机、主尺度或总吨位变更，购置导致所有人变更，转远洋作业。"
    evidence:
      - {doc: POL-STD-010, section: "第三十六条"}
      - {doc: POL-STD-010, section: "第三十七条"}
  Q-M14:
    points:
      - "渔具按类、型、式分类；类的代号为C刺网、W围网、T拖网、Zh张网、D钓具、Di地拉网、Ch抄网、Y掩罩、P耙刺、F敷网、X陷阱、L笼壶。"
      - "名称按式+型+类书写，代号按类·型·式书写，例如20·dp·C为定置单片刺网。"
    evidence:
      - {doc: OPS-STD-039}
  Q-M15:
    points:
      - "以调查区域内所有海洋捕捞渔船为抽样总体，按船籍港省/市/县、渔具类、主机功率四档分层。"
      - "按GB/T 2828.1—2012一次抽样方案确定每层样本量，样本量可按实际情况调整。"
    evidence:
      - {doc: OPS-STD-035}
  Q-M16:
    points:
      - "海洋渔业资源费年征收金额按渔船前3年采捕水产品平均年总产值的1%至3%确定。"
      - "专项采捕经济价值较高品种的，按该品种前3年平均年总产值的3%至5%确定；具体标准由省级或海区在幅度内制定。"
    evidence:
      - {doc: POL-RULE-020, section: "第五条"}
  Q-M17:
    points:
      - "国家对渔业船舶实行强制检验，分为初次检验、营运检验和临时检验。"
      - "初次检验在投入营运前实施；营运检验按周期实施；临时检验适用于证书失效、被责令检验等特定情形。"
    evidence:
      - {doc: POL-RULE-019, section: "第四条"}
      - {doc: POL-RULE-019, section: "第十九条"}
  Q-M18:
    abstain: true
    reason: "yearbook port table missing for data years 2018-2019; the system must refuse."

  Q-C01:
    points:
      - "船长应当保证：所有值班人员必须由持有相应适任证书的职务船员担任；非值班人员不得随意进入驾驶室。"
      - "值班人员上岗前必须经过充分休息，航行期间不得饮酒；不得安排正在值班的人员从事与值班无关的事项。"
    evidence:
      - {doc: POL-WATCH-082, section: "第三条"}
  Q-C02:
    points:
      - "交接班必须交清船位、拖网与放网时间、航向、拖向、拖速、流速、风速、流压差，以及助航、助渔仪器的使用情况。"
      - "还应交清主副船或围网船及周围船舶动态、岛屿航标障碍物、天气海况、航标识别、下一班危险、船长布置事项和航行计划变化。"
    evidence:
      - {doc: POL-WATCH-082, section: "第十五条"}
  Q-C03:
    points:
      - "船舶进出渔港应按规定办理签证；在渔港内应服从渔政渔港监督管理机关对水域交通安全秩序的管理；停泊期间应留足值班人员。"
      - "违反的，对船长予以警告，可处50元以上500元以下罚款；情节严重的扣留职务船员证书3至6个月；特别严重的吊销船长证书。"
    evidence:
      - {doc: POL-PEN-078, section: "第九条"}
  Q-C04:
    abstain: true
    reason: "no registered source states the 2026 fuel-subsidy standard; POL-GEAR-016 only mentions a possible deduction, not the standard."
  Q-O01:
    points:
      - "海洋渔业捕捞许可证和内陆渔业捕捞许可证的使用期限为5年；其他种类最长不超过3年。"
      - "使用期届满的，应在届满前3个月内向原发证机关申请换发；换发时收回原证并注销。"
    evidence:
      - {doc: POL-STD-010, section: "第三十五条"}
      - {doc: POL-STD-010, section: "第三十六条"}
  Q-O02:
    points:
      - "制造、更新改造、进口渔船的船网工具指标批准书有效期为18个月，购置渔船为6个月。"
      - "因特殊原因无法按期办理的，可在届满前3个月内申请延展18个月；远洋特殊渔区可再延展18个月；逾期注销并收回指标。"
    evidence:
      - {doc: POL-STD-010, section: "第十六条"}
  Q-O03:
    points:
      - "国家实行强制检验，分为初次检验、营运检验和临时检验；初次检验在投入营运前实施，适用于制造、改造、进口的渔业船舶。"
      - "营运检验是营运中的常规检验；临时检验适用于检验证书失效无法及时回船籍港、被责令检验等特定情形。"
    evidence:
      - {doc: POL-RULE-019, section: "第四条"}
      - {doc: POL-RULE-019, section: "第六条"}
      - {doc: POL-RULE-019, section: "第十三条"}
      - {doc: POL-RULE-019, section: "第十九条"}
  Q-O04:
    abstain: true
    reason: "no registered source covers the loan process or interest rate; the local regulations only require mortgage registration."
  Q-F01:
    points:
      - "渔业行政处罚种类包括罚款，没收渔获物、违法所得、渔具，暂扣、吊销捕捞许可证等渔业证照，以及法律法规规定的其他处罚。"
      - "罚款计罚单位：拖网、流刺网、钓钩等用船作业按单艘船；围网按一个作业单位；定置作业用船按单艘、不用船按一个作业单位；炸鱼毒鱼电鱼等用船按单艘、不用船按人；赶海、潜水按人。"
    evidence:
      - {doc: POL-PEN-080, section: "第二条"}
      - {doc: POL-PEN-080, section: "第五条"}
  Q-F02:
    points:
      - "未经批准在渔港内装卸易燃易爆有毒危险货物、新建改建扩建设施或从事碍航捕捞养殖的，责令停止作业，对船长或直接责任人予以警告，并可处500元以上1000元以下罚款。"
    evidence:
      - {doc: POL-PEN-078, section: "第十条"}
  Q-F03:
    points:
      - "船籍港休渔：以县为单位建立应休渔渔船、重点监管渔船台账，督促所有应休渔渔船按时返回船籍港集中休渔；长期异地渔船必须在船籍港地休渔。"
      - "专项捕捞监管：落实2026年专项捕捞许可通告，从严查处无证作业、超时限作业、违规转载渔获物、擅自改变作业类型；专项捕捞船须配齐救生消防设备、船员持证。"
    evidence:
      - {doc: POL-ENF-068, section: "一、重点任务"}
  Q-F04:
    points:
      - "不得发放捕捞许可证的情形包括：使用破坏渔业资源、明令禁止的渔具或捕捞方法；未按规定办理制造、更新改造、购置或进口捕捞渔船的批准手续；未领取渔业船舶证书、航行签证簿、职务船员证书、船舶户口簿、渔民证等证件。"
    evidence:
      - {doc: POL-RULE-018, section: "第十七条"}
  Q-T01:
    points:
      - "渔具分类名称按“式+型+类”书写；代号按“类·型·式”书写，型和式不限定时可省略。"
      - "类的代号如C刺网、W围网、T拖网；示例20·dp·C为定置单片刺网，01·yn·W为双船有囊围网。"
    evidence:
      - {doc: OPS-STD-039}
  Q-T02:
    points:
      - "以调查区域内所有海洋捕捞渔船为抽样总体，按船籍港省/市/县、渔具类、主机功率四档分层。"
      - "按GB/T 2828.1—2012一次抽样方案确定每层样本量，每层不少于3艘；样本船按GB/T 10111—2008抽选，不再提供信息时及时更换。"
    evidence:
      - {doc: OPS-STD-035}
  Q-T03:
    abstain: true
    reason: "no registered source publishes the total resource-protection fee; POL-RULE-020 gives rates, not a total."

