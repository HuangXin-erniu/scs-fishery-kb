schema_version: 1

source:
  licenses: [public, internal, cc-by-nc-sa-3.0-igo]
  sensitivities: [public, internal, restricted]
  cadences: [daily, weekly, monthly, quarterly, semiannual, annual, edition, irregular, static]
  cadence_caps_days:
    daily: 3
    weekly: 21
    monthly: 60
    quarterly: 150
    semiannual: 240
    annual: 400
    edition: 400
    irregular: 180
    static: 550

document:
  fields:
    - doc_id
    - source_id
    - title
    - title_zh
    - publisher
    - year
    - doc_type
    - sensitivity
    - language
    - page_count
    - file_hash

chunk:
  fields:
    - chunk_id
    - doc_id
    - page
    - section
    - table_id
    - text
    - token_count
    - char_start
    - char_end

citation:
  format: "[{doc_id} p.{page}]"
  fields:
    - doc_id
    - title
    - page
    - section
    - snippet
    - score

sensitivity:
  values: [public, internal, restricted, unknown]
  rules:
    unknown: "held; must not be ingested"
    restricted: "local only; never sent to an external model API"
    internal: "requires owner approval; desensitise before external use"
