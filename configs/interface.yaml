schema_version: 1
service: scs-fkb-v2
base_url: http://127.0.0.1:8765
versioning:
  scheme: path
  current: v1
  stability: local-single-user
auth:
  optional: true
  env: SCS_FKB_API_KEY
  header: X-API-Key
  note: When the environment variable is set, every /v1 request must send it.
limits:
  question_chars: 500
  top_k: 5
  citations_displayed: 20
  web_results: 2
  feedback_chars: 1000
endpoints:
  - {method: POST, path: /v1/query, purpose: answer a question}
  - {method: GET, path: /v1/sources, purpose: list registered sources}
  - {method: GET, path: /v1/playbooks, purpose: list approved playbooks}
  - {method: POST, path: /v1/feedback, purpose: record helpfulness}
  - {method: GET, path: /healthz, purpose: liveness}
  - {method: GET, path: /readyz, purpose: readiness and index version}
  - {method: GET, path: /, purpose: server-rendered Web UI}
query:
  request: [question, persona, region, year, web, short, rerank, mode, max_chars]
  answer_modes: [standard, short, full, dump, llm, quotes, facet, extractive]
  max_chars: {min: 1000, max: 20000, default: 12000}
  web_modes: [off, auto, on]
  web_default: off
  response: [request_id, answer, summary, citations_total, citations, used_web, web_leads,
             abstained, reason, mode, playbook, index_version, answerability, conclusion,
             conditions, gap, channel, as_of, numbers, answer_mode, evidence, freshness,
             confidence, cache, judge, provisional, clarify_slots, latency_ms, disclaimer]
  modes: [kb_only, kb_plus_web, clarify, abstain]
citations:
  corpus: "[doc_id p.N §section]"
  web_lead: "[WEB:domain:hash8] URL (抓取于 YYYY-MM-DD)"
  web_label: 网络检索 · 未入知识库
  note: Web leads are separate from citations and never support an abstention.
web:
  allowlist: configs/web-sources.yaml
  transport: https-only
  ttl_days: {warning: 7, status: 7, rule: 30, definition: 90, identification: 90,
             statistics: 365, history: 365}
  max_evidences: 2
  max_bytes: 2000000
  spacing_seconds: 2
  cache: "<data_root>/web-cache"
  auto_triggers: [freshness_cue, stale_evidence, canonical_abstained]
  ingest: never-automatic
feedback:
  storage: run_root/feedback.jsonl
  fields: [request_id, helpful, comment, question, created_at]
disclaimer: 以官方发布文本为准；本服务不构成法律意见。
