schema_version: 1
updated_at: '2026-11-06'
playbooks:
- id: PLAY-CAPTAIN-001
  title: 南海伏季休渔合规自查
  persona: captain
  applies_to: {region: [national], year: 2026, vessel_type: marine_capture}
  steps:
  - order: 1
    action: 确认作业类型是否属于休渔范围
    detail: 除钓具外的所有作业类型，以及为捕捞渔船配套服务的捕捞辅助船，均纳入休渔管理。
    facts: [FACT-POLICY-002]
  - order: 2
    action: 核对休渔时间与海域
    detail: 南海区休渔时间为5月1日12时至8月16日12时，海域为北纬26度30分至北纬12度。
    facts: [FACT-POLICY-001]
  - order: 3
    action: 识别违规后果
    detail: 违反禁渔区、禁渔期规定捕捞的，面临没收渔获物、违法所得和渔具及罚款；情节严重的吊销捕捞许可证，可以没收船舶。
    facts: [FACT-POLICY-011]
  documents: [捕捞许可证, 船舶国籍证书]
  deadlines: ['5月1日12时前完成休渔准备', '8月16日12时后按开渔安排作业']
  penalties: [没收渔获物和违法所得, 罚款, 吊销捕捞许可证]
  sources: [POL-CLOS-015, POL-LAW-009]
  status: approved
  review_due: '2027-02-02'
- id: PLAY-OWNER-002
  title: 2026年专项（特许）捕捞申请
  persona: owner
  applies_to: {region: [national], year: 2026, vessel_type: marine_capture}
  steps:
  - order: 1
    action: 判断可申请的作业类型
    detail: 桁杆拖虾、笼壶类、刺网、灯光围（敷）网4种作业类型，在指定海域和船籍港条件下可申请专项捕捞。
    facts: [FACT-POLICY-003]
  - order: 2
    action: 准备申请材料
    detail: 按捕捞许可证申请材料清单准备申请书、身份或营业执照、检验证书、国籍证书、所有权登记证书、渔具和捕捞方法说明等。
    facts: [FACT-POLICY-009]
  - order: 3
    action: 核对证书有效期
    detail: 专项许可应与捕捞许可证使用期限衔接；许可证期满前3个月内申请换发。
    facts: [FACT-POLICY-005]
  sources: [POL-SPEC-041, POL-STD-010]
  status: approved
  review_due: '2027-02-02'
- id: PLAY-OWNER-003
  title: 海洋渔业捕捞许可证申请
  persona: owner
  applies_to: {region: [national], year: 2026, vessel_type: marine_capture}
  steps:
  - order: 1
    action: 准备申请材料
    detail: 申请书、户口簿或营业执照、检验证书、国籍证书、所有权登记证书、渔具和捕捞方法说明；海洋许可另需组织意见、指标批准书或原证。
    facts: [FACT-POLICY-009]
  - order: 2
    action: 确认许可证期限
    detail: 海洋渔业捕捞许可证使用期限为5年。
    facts: [FACT-POLICY-004]
  sources: [POL-STD-010]
  status: approved
  review_due: '2027-02-02'
- id: PLAY-OWNER-004
  title: 捕捞许可证换发与年审
  persona: owner
  applies_to: {region: [national], year: 2026, vessel_type: marine_capture}
  steps:
  - order: 1
    action: 在期满前3个月内申请换发
    detail: 使用期届满前3个月内向原发证机关申请换发；换发时收回原证并注销。
    facts: [FACT-POLICY-005]
  - order: 2
    action: 核对年审条件
    detail: 检验证书和国籍证书有效；所有人、主尺度、主机功率、总吨位未变更；作业类型、场所、时限、渔具数量一致；日志、资源费、处罚履行。
    facts: [FACT-POLICY-010]
  sources: [POL-STD-010]
  status: approved
  review_due: '2027-02-02'
- id: PLAY-OWNER-005
  title: 船网工具指标申请与使用
  persona: owner
  applies_to: {region: [national], year: 2026, vessel_type: marine_capture}
  steps:
  - order: 1
    action: 核对指标批准书有效期
    detail: 制造、更新改造、进口渔船18个月；购置渔船6个月；可在届满前3个月内申请延展18个月；远洋特殊渔区可再延展18个月；逾期注销并收回指标。
    facts: [FACT-POLICY-006]
  - order: 2
    action: 核对制造、更新改造规则
    detail: 船数和功率不得超过被淘汰渔船；大中型与小型不得转换；大中型不得跨海区买卖。
    facts: [FACT-POLICY-017]
  sources: [POL-STD-010]
  status: approved
  review_due: '2027-02-02'
- id: PLAY-CAPTAIN-006
  title: 渔捞日志填报
  persona: captain
  applies_to: {region: [national], year: 2026, vessel_type: marine_capture}
  steps:
  - order: 1
    action: 记录规定事项
    detail: 记载捕捞作业、进港卸载渔获物、水上收购或转运渔获物等情况。
    facts: [FACT-POLICY-007]
  - order: 2
    action: 避免违规
    detail: 未按规定提交或填写不真实、不规范的，警告、责令改正；逾期不改正处1000元以上1万元以下罚款。
    facts: [FACT-POLICY-008]
  sources: [POL-RULE-018]
  status: approved
  review_due: '2027-02-02'
- id: PLAY-CAPTAIN-007
  title: 渔船进出渔港报告
  persona: captain
  applies_to: {region: [national], year: 2026, vessel_type: marine_capture}
  steps:
  - order: 1
    action: 遵守渔港管理章程和避碰规则
    detail: 进出渔港应遵守渔港管理章程和国际海上避碰规则，向渔政渔港监督管理机关报告，接受安全检查。
    facts: [FACT-POLICY-013]
  - order: 2
    action: 认识未报告后果
    detail: 未报告可责令改正，并处警告、罚款；情节严重的扣留或者吊销船长职务证书。
    facts: [FACT-POLICY-014]
  sources: [POL-RULE-018]
  status: approved
  review_due: '2027-02-02'
- id: PLAY-OWNER-008
  title: 渔业船舶检验安排
  persona: owner
  applies_to: {region: [national], year: 2026, vessel_type: marine_capture}
  steps:
  - order: 1
    action: 确认检验种类
    detail: 强制检验分为初次检验、营运检验和临时检验。
    facts: [FACT-POLICY-015]
  sources: [POL-RULE-019]
  status: approved
  review_due: '2027-02-02'
- id: PLAY-OWNER-009
  title: 渔业资源增殖保护费
  persona: owner
  applies_to: {region: [national], year: 2026, vessel_type: marine_capture}
  steps:
  - order: 1
    action: 核对征收幅度
    detail: 按前三年平均年总产值的1%至3%征收；具体标准按作业类型和地区执行。
    facts: [FACT-POLICY-016]
  sources: [POL-RULE-020]
  status: approved
  review_due: '2027-02-02'
- id: PLAY-CAPTAIN-010
  title: 渔具最小网目与准用/过渡渔具自查
  persona: captain
  applies_to: {region: [national], year: 2026, vessel_type: marine_capture}
  steps:
  - order: 1
    action: 确认制度实施范围
    detail: 2014年6月1日起，黄渤海、东海、南海全面实施最小网目尺寸制度。
    facts: [FACT-GEAR-001]
  - order: 2
    action: 区分准用渔具与过渡渔具
    detail: 准用渔具是国家允许使用的海洋捕捞渔具；过渡渔具按附件标准执行。
    facts: [FACT-GEAR-004]
  - order: 3
    action: 按规定方法测量网目
    detail: 按GB/T 6964—2010规定，采用扁平楔形网目内径测量仪测量，网目沿纵向或长轴方向充分拉直。
    facts: [FACT-GEAR-005]
  sources: [POL-GEAR-016, POL-GEAR-033]
  status: approved
  review_due: '2027-02-02'
- id: PLAY-EXTENSION-011
  title: 渔具分类、命名与代号
  persona: extension
  applies_to: {region: [national], year: 2026, vessel_type: marine_capture}
  steps:
  - order: 1
    action: 使用规范分类
    detail: 按GB/T 5147—2026的类、型、式分类和代号书写；名称按式+型+类书写，代号按类·型·式书写。
    facts: [FACT-GEAR-011]
  - order: 2
    action: 使用标准类名称与代号
    detail: C刺网、W围网、T拖网、Zh张网、D钓具、Di地拉网、Ch抄网、Y掩罩、P耙刺、F敷网、X陷阱、L笼壶。
    facts: [FACT-GEAR-002]
  sources: [OPS-STD-039]
  status: approved
  review_due: '2027-02-02'
- id: PLAY-CAPTAIN-012
  title: 渔业行政处罚应对
  persona: captain
  applies_to: {region: [national], year: 2026, vessel_type: marine_capture}
  steps:
  - order: 1
    action: 了解禁渔区、禁渔期违规后果
    detail: 没收渔获物、违法所得和渔具，处20万元以下罚款；情节严重处20万元以上200万元以下罚款，吊销捕捞许可证，可以没收船舶。
    facts: [FACT-POLICY-011]
  - order: 2
    action: 了解无证捕捞罚款
    detail: 海洋水域10万元以下；内陆水域5万元以下。
    facts: [FACT-POLICY-012]
  sources: [POL-LAW-009, POL-PEN-078]
  status: approved
  review_due: '2027-02-02'
- id: PLAY-CAPTAIN-013
  title: 渔港停泊与安全检查
  persona: captain
  applies_to: {region: [national], year: 2026, vessel_type: marine_capture}
  steps:
  - order: 1
    action: 进出港报告并接受安全检查
    detail: 向渔政渔港监督管理机关报告，接受安全检查。
    facts: [FACT-POLICY-013]
  - order: 2
    action: 避免未报告处罚
    detail: 未报告可责令改正，并处警告、罚款；情节严重的扣留或者吊销船长职务证书。
    facts: [FACT-POLICY-014]
  sources: [POL-RULE-018]
  status: approved
  review_due: '2027-02-02'
- id: PLAY-EXTENSION-014
  title: 海洋捕捞统计口径说明
  persona: extension
  applies_to: {region: [national], year: 2026, vessel_type: marine_capture}
  steps:
  - order: 1
    action: 说明海区口径
    detail: 海洋捕捞产量按捕捞海域分为渤海、黄海、东海和南海区。
    facts: [FACT-STATS-001]
  - order: 2
    action: 说明渔船分类口径
    detail: 机动渔业船舶指依靠本船主机动力推进的渔业船舶，分为渔业生产船和渔业辅助船；捕捞船按主机功率、船长和作业方式分类。
    facts: [FACT-STATS-002]
  sources: [DICT-STAT-013]
  status: approved
  review_due: '2027-02-02'
- id: PLAY-CAPTAIN-015
  title: 渔业法基本义务与法律责任
  persona: captain
  applies_to: {region: [national], year: 2026, vessel_type: marine_capture}
  steps:
  - order: 1
    action: 遵守捕捞许可证制度
    detail: 国家对捕捞业实行捕捞许可证制度，捕捞许可证由县级以上人民政府渔业渔政主管部门批准发放。
    facts: [FACT-POLICY-035]
  - order: 2
    action: 遵守捕捞限额制度
    detail: 国家根据捕捞量低于渔业资源增长量的原则确定总可捕捞量，实行捕捞限额制度。
    facts: [FACT-POLICY-033]
  - order: 3
    action: 按许可内容作业并填写日志
    detail: 按许可证规定的作业类型、场所、时限、渔具数量和捕捞限额作业；海洋大中型渔业船舶应如实填写作业日志并至少保存二年。
    facts: [FACT-POLICY-037]
  sources: [POL-LAW-009]
  status: approved
  review_due: '2027-02-02'
