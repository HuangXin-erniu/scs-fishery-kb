- id: FACT-PROV-011
  kind: provision
  topic: policy
  question_class: status
  subject: Notice on the 2026 marine seasonal-closure enforcement action 二、工作要点
  predicate: 条文要点
  value: 二、工作要点 （一）5月1日之前，集中召回在外渔船，督促在港异地渔船返回船籍港休渔。 （二）5月1日至5月10日，组织开展渔港码头专项检查，严格落实港内休渔管理要求；全面部署执法船艇开展海上巡查，实现“船艇应出尽出、渔船应检尽检”。
