  predicate: 条文要点
  value: 三、测量办法 根据GB/T 6964—2010规定，采用扁平楔形网目内径测量仪进行测量。网目长度测量时，网目应沿有结网的纵向或无结网的长轴方向充分拉直，每次逐目测量相邻5目的网目内径，取其最小值为该网片的网目内径。三重刺网在测量时，要测量最里层网的最小网目尺寸；双重刺网要测量两层网中网眼更小的网的最小网目尺寸。各省（自治区、直辖市）渔业行政主管部门可结合本地实际，在上述规定基础上制定出简便易行的测量办法。
