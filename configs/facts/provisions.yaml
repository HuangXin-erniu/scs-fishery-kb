    (三)“渔业水域”，是指中华人民共和国管辖水域中鱼、虾、蟹、贝类的产卵场、索饵场、越冬场、洄游通道和鱼、虾、蟹、贝、藻类及其他水生动植物的养殖场所。 第二章
