    （二）主捕种类为颚针鱼、青鳞鱼、梅童鱼、凤尾鱼、多鳞鱚、少鳞鱚、银鱼、小公鱼等鱼种的刺网作业，由各省（自治区、直辖市）渔业行政主管部门根据此次确定的最小网目尺寸标准实行特许作业，限定具体作业时间、作业区域。拖网主捕种类为鳀鱼，张网主捕种类为毛虾和鳗苗，
