- id: FACT-PROV-102
  kind: provision
  topic: gear
  question_class: procedure
  subject: Standards for navigation watchkeeping on fishing vessels (trial) 第二条
  predicate: 条文要点
  value: 第二条 渔业船舶所有人应根据本准则，并结合所属船舶的具体情况做到： 1.渔船所有值班人员都必须根据国家有关规定持有相应证书； 2.编制船舶的航行值班规则，并报所在地渔港监督机关批准；
    3.值班规则应悬挂在船舶驾驶室、轮机舱和无线电通信室内，并确保船长和相应的值班人员遵守； 4.保证船长能组织和领导船上的一切工作，船长和其他所有船员都必须按国家有关规定进行培训、考试，并持有相应证书；
    5.船上安装的通信和助航仪器以及保障船舶安全航行的任何设备都必须处于正常的使用状态。
  evidence: 第二条 渔业船舶所有人应根据本准则，并结合所属船舶的具体情况做到： 1.渔船所有值班人员都必须根据国家有关规定持有相应证书； 2.编制船舶的航行值班规则，并报所在地渔港监督机关批准；
