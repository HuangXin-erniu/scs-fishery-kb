  question_class: procedure
  subject: Standards for navigation watchkeeping on fishing vessels (trial) 第三条
  predicate: 条文要点
  value: 第三条 船长应当保证： 1.所有值班人员必须由持有相应适任证书的职务船员担任； 2.除航行值班人员外其他人员不得随意进入驾驶室； 3.所有值班人员上岗前必须经过充分休息，不能因值班人员疲劳而影响航行安全；
    4.在航行期间值班人员不得饮酒； 5.不得安排正在值班的值班人员从事与值班无关的事项。
