- id: FACT-GEAR-004
  kind: provision
  topic: gear
  question_class: procedure
  subject: 农业部关于实施海洋捕捞准用渔具和过渡渔具最小网目尺寸制度的通告
  predicate: 二、主要内容
  value: 二、主要内容 （一）根据现有科研基础和捕捞生产实际，海洋捕捞渔具最小网目尺寸制度分为准用渔具和过渡渔具两大类。准用渔具是国家允许使用的海洋捕捞渔具，过渡渔具将根据保护海洋渔业资源的需要，今后分别转为准用或禁用渔具，并予以公告。
    （二）主捕种类为颚针鱼、青鳞鱼、梅童鱼、凤尾鱼、多鳞鱚、少鳞鱚、银鱼、小公鱼等鱼种的刺网作业，由各省（自治区、直辖市）渔业行政主管部门根据此次确定的最小网目尺寸标准实行特许作业，限定具体作业时间、作业区域。拖网主捕种类为鳀鱼，张网主
  unit: null
  qualifiers: {}
  jurisdiction: national
  effective:
    from: null
    to: null
  evidence: 二、主要内容 （一）根据现有科研基础和捕捞生产实际，海洋捕捞渔具最小网目尺寸制度分为准用渔具和过渡渔具两大类。准用渔具是国家允许使用的海洋捕捞渔具，过渡渔具将根据保护海洋渔业资源的需要，今后分别转为准用或禁用渔具，并予以公告。
    （二）主捕种类为颚针鱼、青鳞鱼、梅童鱼、凤尾鱼、多鳞鱚、少鳞鱚、银鱼、小公鱼等鱼种的刺网作业，由各省（自治区、直辖市）渔业行政主管部门根据此次确定的最小网目尺寸标准实行特许作业，限定具体作业时间、作业区域。拖网主捕种类为鳀鱼，张网主捕种类为毛虾和鳗苗，围网主捕种类为青鳞鱼、前鳞骨鯔、斑鰶、金色小沙丁鱼、小公鱼等特定鱼种的，由各省（自治区、直辖市）渔业行政主管部门根据捕捞
