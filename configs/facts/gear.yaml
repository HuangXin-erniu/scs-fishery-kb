- id: FACT-GEAR-003
  kind: atomic
  topic: gear
  question_class: procedure
  subject: 海洋捕捞抽样调查
  predicate: 分层与样本量
  value: 按船籍港省/市/县、渔具类、主机功率四档分层；每层样本不少于3艘
  unit: null
  qualifiers: {}
  jurisdiction: national
  effective:
    from: '2026-05-01'
    to: null
  evidence: 'SC/T ９４６０—２０２５ 以调查区域内所有海洋捕捞渔船为抽样总体,按以下特征划分为若干层. a) 根据船籍港按照省、市、县分层; b)
    按照 GB/T５１４７—２００３ 第 ３ 章中的“类”分层.渔船数量少、年渔获量较低的类型可合并为“其他”. c) 按照主机功率 ＜４４kW、 ４４kW(含)~２２０kW、
    ２２０kW(含)~４４０kW 和 ≥４４０kW 分层. ５ 􀆰２ 样本量确定 按照 GB/T２８２８ 􀆰１—２０１２ 第 １０ 章中一次抽样方案规定,确定每一层样本渔船的样本量.样本量可
    根据实际情况适当调整,但每层不应少于 ３ 艘. ５ 􀆰３ 样本渔船选择 按照 GB/T１０１１１—２００８ 中第 ８ 章规定,抽选样本渔船.渔船因拆解、出售等原因不再提供捕捞信息
    时,应及时进行更换. ６ 信息调查 ６ 􀆰１ 渔捞日志调查 捕捞渔船实时填写渔捞日志,实时报送或航次结束后提交信息采集员.渔捞日志记录见附录 A 中的 表
    A􀆰１. ６ 􀆰２ 返港渔船调查 在渔港随机调查返港渔船,由信息采集员通过问询等方式调查最 近 一 个 航 次 的 捕 捞 生 产 情 况.返 港 渔船调查记录见表
    A􀆰２. ６ 􀆰３ 经济效益调查 调查海洋捕捞生产渔船在某月的捕捞生产收入与支出情况.经济效益记录见表 A􀆰３. ７ 数据质量控制 信息采集员对海洋捕捞信息的完整性、准确性、真实性进行核验.核验包括但不限于如下内容:
    a) 航次日均渔获量应处于该作业类型的合理区间内; b) 航次产值除以航次渔获量得到的渔获平均单价应处于合理价格区间内; c) 捕捞生产位置(作业渔区)应符合渔获种类的分布特性.
    ８ 统计分析 ８ 􀆰１ 总渔获量 １)计算总渔获量. 按公式( － － Y ＝∑h yhdh 􀆺􀆺􀆺􀆺􀆺􀆺􀆺􀆺􀆺􀆺􀆺􀆺􀆺􀆺􀆺􀆺 ( ＝１Nh １) L 式中:
    Y ———总渔获量,单位为千克( kg); L ———渔船分层的总层数;'
