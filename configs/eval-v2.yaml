- id: EV2-004
  question: 农业部关于实施海洋捕捞准用渔具和过渡渔具最小网目尺寸制度的通告的二、主要内容要求是什么？
  split: dev
  persona: extension
  expected:
    answer: 二、主要内容 （一）根据现有科研基础和捕捞生产实际，海洋捕捞渔具最小网目尺寸制度分为准用渔具和过渡渔具两大类。准用渔具是国家允许使用的海洋捕捞渔具，过渡渔具将根据保护海洋渔业资源的需要，今后分别转为准用或禁用渔具，并予以公告。
      （二）主捕种类为颚针鱼、青鳞鱼、梅童鱼、凤尾鱼、多鳞鱚、少鳞鱚、银鱼、小公鱼等鱼种的刺网作业，由各省（自治区、直辖市）渔业行政主管部门根据此次确定的最小网目尺寸标准实行特许作业，限定具体作业时间、作业区域。拖网主捕种类为鳀鱼，张网主
    terms:
    - 农业部关于实施海
    - 洋捕捞准用渔具和
    - 过渡渔具最小网目
    - 尺寸制度的通告
    - 主要内容
    - 根据现有科研基础
    - 和捕捞生产实际
    - 海洋捕捞渔具最小
    evidence:
    - doc: POL-GEAR-016
      section: 二、主要内容
    abstained: false
  source_fact: FACT-GEAR-004
  review_status: reviewed
- id: EV2-005
  question: 农业部关于实施海洋捕捞准用渔具和过渡渔具最小网目尺寸制度的通告的三、测量办法要求是什么？
  split: dev
  persona: extension
  expected:
    answer: 三、测量办法 根据GB/T 6964—2010规定，采用扁平楔形网目内径测量仪进行测量。网目长度测量时，网目应沿有结网的纵向或无结网的长轴方向充分拉直，每次逐目测量相邻5目的网目内径，取其最小值为该网片的网目内径。三重刺网在测量时，要测量最里层网的最小网目尺寸；双重刺网要测量两层网中网眼更小的网的最小网目尺寸。各省（自治区、直辖市）渔业行政主管部门可结合本地实际，在上述规定基础上制定出简便易行的测量办法
    terms:
    - 农业部关于实施海
    - 洋捕捞准用渔具和
    - 过渡渔具最小网目
    - 尺寸制度的通告
    - 测量办法
    - 根据
    - '6964'
    - '2010'
    evidence:
    - doc: POL-GEAR-016
      section: 三、测量办法
    abstained: false
  source_fact: FACT-GEAR-005
  review_status: reviewed
