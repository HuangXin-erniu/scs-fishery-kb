schema_version: 1
# Official-host allowlist for the optional web-evidence layer. Only these
# domains may be searched, fetched or turned into evidence; HTTPS is required.
# A result from any other host is dropped and recorded by the caller. The web
# layer never writes to configs/corpus.yaml and never ingests automatically.
