provider:
  # Local SearXNG JSON endpoint, for example http://127.0.0.1:8888. Empty means
  # the DuckDuckGo backend is used directly. SEARXNG_URL overrides this value.
  searxng_url: ""
  fallback: ddgs
  backend: auto
  # The local SearXNG keeps two Chinese engines enabled on demand; without this
  # list its default general category returns no rows.
  engines: "sogou,360search"
  # When the first search yields no allowlisted row, retry once with this site
  # restriction; it narrows results to the authoritative TLD already allowlisted.
  site_hint: "gov.cn"
  max_results: 5
  timeout_seconds: 10

limits:
  max_evidences: 2
  max_bytes: 2000000
  snippet_chars: 300
  spacing_seconds: 2
  cache_entries: 200

refresh:
  timeout_seconds: 10
  user_agent: scs-fkb-web/1.0 (+https://github.com/HuangXin-erniu/scs-fishery-kb)
