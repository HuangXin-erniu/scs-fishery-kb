schema_version: 1
updated_at: '2026-11-01'
groups:
- term: 例外
  variants:
  - 专项
  - 特许
  note: Q-M12 asks about 例外 while the rules speak of 专项（特许）许可; this group lifted Q-M12
    into the top five and left recall, false refusals and abstention otherwise unchanged
    (9/11, 2, 5/6).
- term: 起止日期
  variants:
  - 休渔时间
  note: Q-E01 asks for 起止日期 while the closure notice says 休渔时间; this group recovered
    Q-E01 at rank two and left every other question unchanged (10/11 before the Q-M10
    wording fix).
- term: SSTa
  variants:
  - 海表温度距平
  - SSTA
  - 海温距平
  note: 'P1 gap: user asks SSTa/SST; official GB/T 44955-2024 uses 海表温度距平.'
- term: 渔情产品
  variants:
  - 渔情预报
  - 渔场预报
  - 预警报产品
  note: 'P1 gap: forecast-product access; official notices use 渔情预报/预警报产品.'
- term: 贝毒
  variants:
  - 织纹螺
  - 麻痹性贝类毒素
  - 贝类毒素
  note: 'P1 shellfish gap: formal local bans name 织纹螺 and PSP.'
- term: 编组生产
  variants:
  - 编队生产
  - 编队
  - 单船作业
  note: Gap query uses 编组; Shandong regulation says 编队生产.
- term: 赤潮
  variants:
  - 贝毒
  - 麻痹性贝类毒素
  - 织纹螺
  note: Gap query asks 赤潮+吃贝; formal ban uses 织纹螺/PSP.
- term: 缺氧
  variants:
  - 低氧
  - 溶解氧
  note: 'A1 citation repair: hypoxia questions use 缺氧 while bulletins say 低氧.'
- term: 热浪
  variants:
  - 海洋热浪
  note: 'A1 citation repair: marine heatwave terminology.'
- term: 海龟
  variants:
  - 水生野生动物
  - 珍贵濒危水生野生动物
  note: 'A1 citation repair: turtle questions map to wildlife law.'
- term: 白海豚
  variants:
  - 珍贵濒危水生野生动物
  - 水生野生动物
  note: 'A1 citation repair: dolphin questions map to wildlife law.'
- term: 鱼类丰度
  variants:
  - 种类特异性
  - ENSO响应
  note: 'A1 citation repair: ENSO fish-abundance paper.'
- term: 厄尔尼诺
  variants:
  - ENSO响应
  - 种类特异性
  note: 'A1 citation repair: ENSO fish-abundance paper.'
- term: 公报
  variants:
  - 监测公报
  note: 'A1 citation repair: marine ecological bulletin.'
- term: 最小可捕规格
  variants:
  - 幼鱼比例
  - 可捕规格
  note: 'B/C repair: minimum catch size table.'
- term: 玳瑁
  variants:
  - 国家一级
  - 海龟科
  note: 'D repair: 2021 list upgrade.'
rejected:
- term: 休渔
  variants:
  - 禁渔
  - 禁渔期
  - 休渔期
  note: Dropped; it cost Q-E01 and raised false refusals from two to three (7/11,
    3).
- term: 捕捞日志
  variants:
  - 渔捞日志
  note: Dropped; it changed nothing on top of 例外 (same 9/11, 2, 5/6), so the lexicon
    stays minimal.
- term: 准入
  variants:
  - 申请
  - 许可条件
  - 审批
  note: Dropped; it removed both false refusals but cost Q-E09 and left recall at
    8/11, a trade the baseline does not need.
- term: 网目
  variants:
  - 网眼
  note: Dropped; it did not recover Q-E10 and changed nothing else.
