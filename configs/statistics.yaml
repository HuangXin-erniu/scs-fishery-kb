# Public schema for the local yearbook indicator table.
# Values are never stored here; the CSV stays in the local data/run roots.

schema_version: 1
updated_at: "2026-10-31"

long_table:
  description: "One row per indicator, region and dimension combination."
  columns:
    - name: data_year
      type: integer
      description: "Calendar year of the data, not the edition year."
    - name: edition
      type: integer
      description: "Yearbook edition year."
    - name: type
      type: string
      description: "One of the eight corpus types; statistical_yearbook for this table."
    - name: region
      type: string
      nullable: true
      description: "Province-level region, or null for a national/sea-area-only row."
    - name: sea_area
      type: string
      nullable: true
      description: "Sea area, currently South China Sea only."
    - name: gear
      type: string
      nullable: true
      description: "Capture gear group."
    - name: operation_type
      type: string
      nullable: true
      description: "Vessel operation type."
    - name: power_band
      type: string
      nullable: true
      description: "Vessel engine-power band."
    - name: length_band
      type: string
      nullable: true
      description: "Vessel length band; the length table is a marine production-vessel proxy."
    - name: species
      type: string
      nullable: true
      description: "Species or species group."
    - name: indicator
      type: string
      description: "Indicator identifier, for example capture_production."
    - name: value
      type: number
      nullable: true
      description: "Numeric value as published; blank stays blank."
    - name: unit
      type: string
      description: "Published unit."
    - name: basis
      type: string
      description: "Published, derived subtotal or difference marker."
    - name: table_id
      type: string
      nullable: true
      description: "Yearbook table number or local table code."
    - name: table_name
      type: string
      description: "Yearbook table title."
    - name: source_file
      type: string
      description: "Data-root-relative source file path."
    - name: sheet
      type: string
      nullable: true
      description: "Worksheet name."
    - name: row
      type: integer
      nullable: true
      description: "One-based row in the source worksheet."
    - name: source_sha256
      type: string
      description: "SHA-256 of the source file."

dimensions:
  region:
    values: [China, Guangdong, Guangxi, Hainan, Fujian]
    names_zh: [全国, 广东, 广西, 海南, 福建]
    notes: "Fujian appears only as a background row for the published South China Sea column in data years 2017-2020; the South China Sea column excludes it from 2021 onward."
  sea_area:
    values: [South China Sea]
    names_zh: [南海]
  gear:
    values: [trawl, purse_seine, gillnet, stow_net, hook, other]
    names_zh: [拖网, 围网, 刺网, 张网, 钓具, 其他]
  operation_type:
    values: [trawl, purse_seine, gillnet, stow_net, hook, other]
    names_zh: [拖网, 围网, 刺网, 张网, 钓业, 其他]
  power_band:
    values: [under_44_1_kw, 44_1_to_441_kw, at_least_441_kw]
    names_zh: [44.1千瓦以下, 44.1(含)～441千瓦, 441千瓦(含)以上]
  length_band:
    values: [at_least_24m, 12_to_24m, under_12m]
    names_zh: [24米(含)以上, 12(含)～24米, 12米以下]
    notes: "Derived from the marine production-vessel length table; not capture-only."
  basis:
    values: [published, published_south_sea, three_province_subtotal, difference]
    descriptions:
      published: "A value printed in the source table."
      published_south_sea: "The yearbook's published South China Sea column; includes Fujian in data years 2017-2020 and excludes it from 2021 onward."
      three_province_subtotal: "Sum of Guangdong, Guangxi and Hainan rows."
      difference: "published_south_sea minus three_province_subtotal."

indicator_groups:
  capture:
    indicators:
      - capture_production
      - capture_production_sea_area
      - capture_production_gear
      - capture_production_species
    units: [ton]
  vessels:
    indicators:
      - vessel_count
      - vessel_gross_tonnage
      - vessel_kilowatts
    dimensions: [operation_type, power_band, length_band]
    units: [vessel, gross_ton, kilowatt]
    notes: "Length uses the marine production-vessel proxy, not capture-only vessels."
  population:
    indicators:
      - marine_fishery_population
      - traditional_fishers
      - marine_fishery_employment
      - capture_employment
    units: [person]
  economy:
    indicators:
      - marine_capture_output_value
    units: [ten_thousand_yuan]
  infrastructure:
    indicators:
      - coastal_central_fishing_port
      - coastal_class1_fishing_port
      - coastal_class2_fishing_port
      - coastal_class3_fishing_port
      - coastal_unrated_fishing_port
    units: [count]

units:
  ton: "吨"
  vessel: "艘"
  gross_ton: "总吨"
  kilowatt: "千瓦"
  person: "人"
  ten_thousand_yuan: "万元"
  count: "个"

publication:
  values: local_only
  public_metadata: "edition, data year, file counts, SHA-256 and coverage counts"

indicator_names_zh:
  capture_production: 海洋捕捞产量
  capture_production_sea_area: 海洋捕捞产量（按海域分）
  capture_production_gear: 海洋捕捞产量（按渔具分）
  capture_production_species: 海洋捕捞产量（按品种分）
  vessel_count: 海洋捕捞机动渔船数量
  vessel_gross_tonnage: 海洋捕捞机动渔船总吨位
  vessel_kilowatts: 海洋捕捞机动渔船功率
  marine_fishery_population: 海洋渔业人口
  traditional_fishers: 传统渔民
  marine_fishery_employment: 海洋渔业从业人员
  capture_employment: 海洋捕捞从业人员
  marine_capture_output_value: 海洋捕捞产值
  coastal_central_fishing_port: 沿海中心渔港
  coastal_class1_fishing_port: 沿海一级渔港
  coastal_class2_fishing_port: 沿海二级渔港
  coastal_class3_fishing_port: 沿海三级渔港
  coastal_unrated_fishing_port: 沿海未评级渔港

query:
  years: [2017, 2025]
  aliases:
    region: {全国: China, 中国: China, 广东: Guangdong, 广东省: Guangdong, 广西: Guangxi, 海南: Hainan, 福建: Fujian}
    sea_area: {南海区: South China Sea, 南海: South China Sea}
    gear: {拖网: trawl, 围网: purse_seine, 刺网: gillnet, 张网: stow_net, 钓具: hook, 钓业: hook, 其他: other}
    indicator_cues:
      产量: capture production
      船数: vessel count
      总吨: vessel tonnage
      千瓦: vessel power
      渔民: fishery population
      从业人员: fishery employment
      产值: capture output value
      渔港: fishing ports
  gaps:
    - 产量没有按作业类型分的维度：海域产量表与按渔具分产量表分列，二者不可交叉。
    - 船数、总吨与功率表没有海域维度，只有省份与作业类型。
    - 数据年 2025 来自扫描件抽样，行结构与其余年份不同，输出带抽样标记。
