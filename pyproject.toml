[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scs-fkb"
version = "0.0.0"
description = "South China Sea Nearshore Fishery Knowledge Base: governed corpus, hybrid retrieval and cited answers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "pydantic>=2.6",
  "openai>=1.40",
]

[project.optional-dependencies]
rag = [
  "llama-index-core>=0.11",
  "llama-index-vector-stores-lancedb>=0.2",
  "lancedb>=0.13",
  "fastembed>=0.9",
]
service = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pre-commit>=3.7",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "httpx>=0.27",
]

[project.scripts]
scs-fkb = "scs_fkb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
